name: Publish

# Publishes the package to npm when package.json has a version npm doesn't
# have yet. Most pushes to main don't change the version, and for those this
# checks npm and stops.
#
# It authenticates with npm trusted publishing: npm trusts this workflow file
# in this repository, and GitHub's OIDC token proves the run is from here. No
# npm token is stored anywhere. Trusted publishing needs npm 11.5.1 or later
# and Node 22.14.0 or later; Node 24 ships with a new enough npm. Packages
# published this way get a provenance statement linking the version to this
# run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Two pushes that both bump the version publish one after the other, never
# at once.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm view` exits non-zero both when the version isn't there (E404),
      # which means publish, and when npm can't be reached, which must not.
      - name: Is this version on npm?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if output=$(npm view "$name@$version" version 2>&1); then
            if [ -n "$output" ]; then
              echo "$name@$version is already on npm. Nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 <<< "$output"; then
            echo "$output"
            echo "Couldn't ask npm about $name@$version."
            exit 1
          fi
          echo "$name@$version isn't on npm yet. Publishing it."
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # No dependency cache in a job that publishes, so nothing from an
      # earlier run can end up in the package.
      - if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: pnpm test
      - if: steps.check.outputs.publish == 'true'
        run: pnpm typecheck
      - if: steps.check.outputs.publish == 'true'
        run: pnpm run docs
      - if: steps.check.outputs.publish == 'true'
        run: pnpm run build

      # Packs the tarball, installs it into a scratch project and imports it
      # under Node and TypeScript. See scripts/smoke-test.mjs.
      - if: steps.check.outputs.publish == 'true'
        run: pnpm run smoke

      - if: steps.check.outputs.publish == 'true'
        run: |
          npm --version
          npm publish --provenance --access public
